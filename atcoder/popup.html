<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; width: 260px; padding: 14px; margin: 0; }
      h1 { font-size: 15px; margin: 0 0 8px; }
      p { font-size: 12px; color: #555; margin: 6px 0; }
      #state { font-size: 12px; font-weight: 600; }
      .ok { color: #157347; } .warn { color: #b02a37; }
      button { margin-top: 10px; width: 100%; padding: 8px; border: 0; border-radius: 7px; background: #222; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>AtCoder → GitHub Sync</h1>
    <p id="state">Checking settings…</p>
    <p>Submit on AtCoder and get an <b>AC</b> verdict — your code is committed automatically.</p>
    <button id="open">Open settings</button>
    <script src="popup.js"></script>
  </body>
</html>
